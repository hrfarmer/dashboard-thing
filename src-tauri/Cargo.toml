[package]
name = "txst_lab_dashboard"
version = "0.1.0"
description = "TXST lab runner and Tailscale dashboard"
authors = ["TXST Spacelab"]
edition = "2021"

[lib]
name = "txst_lab_dashboard_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
thiserror = "2"
tokio = { version = "1", features = ["process", "time"] }

[dev-dependencies]
tempfile = "3"
